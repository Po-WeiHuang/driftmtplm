# Llama-3.2-1B-Instruct-MTPV128384 -- FULL production run, MTP + token drift.
#
# This is reproduce_full_1gpu.yaml with the singleshot.drift_* block added and
# nothing else touched except:
#   * dataset/checkpoint/tokenizer paths, repointed from the other cluster's
#     /data/phys-snoplus-snews/exet5937/... root to this one's
#     /data/snoplus/weiiiiiii/... root;
#   * out_dir, given a -drift suffix so the two arms cannot collide;
#   * resume: auto instead of true (see the note there);
#   * the wandb run name.
# Batch shape, LR schedule, optimizer, precision, eval/checkpoint cadence,
# max_tokens and the whole non-drift singleshot block are UNCHANGED, so the two
# arms are directly comparable.
#
# Setting drift_enabled: false AND drift_diagnostics_enabled: false reproduces
# vanilla MTP exactly -- see the note in the singleshot block.
#
# do_compile is inherited as True from the production config. The
# torch.compile / drift-loss interaction was previously untested; it is now
# VERIFIED by condor run 5758027 (SMOKE=1, 20 optimizer steps, compile on,
# drift on): it compiles, trains, and logs drift/loss = 5.613, matching the
# 5.648 measured in the uncompiled 200-step runs to within 0.6%. Compile also
# cuts iteration time from ~370 ms to ~229 ms.
#
# NOTE that run first failed with
#   InductorError: ModuleNotFoundError: No module named 'setuptools.command'
# which was NOT a drift/compile problem: setuptools in the venv was a broken
# partial install (540 of 762 files missing), and only torch.compile exercises
# it. Repaired and pinned as setuptools==83.0.0 in both conda_env.yml and
# requirements-lock.txt. If a fresh environment hits this again, reinstall
# setuptools before blaming the drift path.

# The name of the model to pretrain. Choose from names in ``litgpt.config``. Mutually exclusive with
# ``model_config``. (type: Optional[str], default: null)
model_name: Llama-3.2-1B-Instruct-MTPV128384

# A ``litgpt.Config`` object to define the model architecture. Mutually exclusive with
# ``model_config``. (type: Optional[Config], default: null)
model_config:

# Directory in which to save checkpoints and logs. If running in a Lightning Studio Job, look for it in
# /teamspace/jobs/<job-name>/share. (type: <class 'Path'>, default: out/pretrain)
out_dir: /data/snoplus/weiiiiiii/aiproj/driftmtplm/outputs/Llama-3.2-1B-Instruct-drift_nocolnorm

# The precision to use for pretraining. Possible choices: "bf16-true", "bf16-mixed", "32-true". (type: Optional[str], default: null)
# precision: bf16-mixed
precision: bf16-true

# Optional path to a checkpoint directory to initialize the model from.
# Useful for continued pretraining. Mutually exclusive with ``resume``. (type: Optional[Path], default: null)
initial_checkpoint_dir: /data/snoplus/weiiiiiii/aiproj/driftmtplm/checkpoints/extended/meta-llama/Llama-3.2-1B-Instruct-MTPV128384
                        
# Path to a checkpoint directory to resume from in case training was interrupted, or ``True`` to resume
# from the latest checkpoint in ``out_dir``. An error will be raised if no checkpoint is found. Passing
# ``'auto'`` will resume from the latest checkpoint but not error if no checkpoint exists.
# (type: Union[bool, Literal["auto"], Path], default: False)
# NOTE: "auto", not the production file's "true". `true` raises if no checkpoint
# exists yet, which is exactly the fresh-start case for this arm. "auto" resumes
# a checkpoint if one is there and starts clean if not.
resume: auto

# Data-related arguments. If not provided, the default is ``litgpt.data.TinyLlama``.
data: pqds
# data: Fineweb

# Training-related arguments. See ``litgpt.args.TrainArgs`` for details
train:
  # Fabric distributed strategy. (--train.fabric_strategy)
  fabric_strategy: fsdp

  # Device mesh shape for FSDP. (--train.fsdp_device_mesh)
  fsdp_device_mesh: 1x1

  # Number of optimizer steps between saving checkpoints (type: Optional[int], default: 1000)
  save_interval: 10000

  # Number of optimizer steps between saving the "latest" rolling checkpoint. (--train.save_latest_interval)
  save_latest_interval: 1000

  # Whether to save a checkpoint immediately at the start of training. (--train.initial_save)
  initial_save: True

  # Maximum number of checkpoints to keep on disk (null = keep all). (--train.max_ckpts_to_keep)
  max_ckpts_to_keep: null

  # Learning rate schedule. (--train.lr_schedule)
  lr_schedule: constant

  # Number of iterations between logging calls (type: int, default: 1)
  log_interval: 20

  # Number of samples between optimizer steps across data-parallel ranks (type: int, default: 512)
  global_batch_size: 128

  # Number of samples per data-parallel rank (type: int, default: 4)
  micro_batch_size: 32

  # Number of iterations with learning rate warmup active (type: int, default: 2000)
  lr_warmup_steps: 2000

  # Number of epochs to train on (type: Optional[int], default: null)
  epochs:

  # Total number of tokens to train on (type: Optional[int], default: 3000000000000)
  max_tokens: 2000000000

  # Limits the number of optimizer steps to run. (type: Optional[int], default: null)
  max_steps:

  # Limits the length of samples. Off by default (type: Optional[int], default: null)
  max_seq_length: 160

  # Whether to tie the embedding weights with the language modeling head weights. (type: Optional[bool], default: False)
  tie_embeddings: False

  #   (type: Optional[float], default: 1.0)
  max_norm: 1.0

  #   (type: float, default: 4e-04)
  peak_lr: 1e-5

  #   (type: float, default: 4e-05)
  min_lr: null

  # Whether to torch.compile the model. (--train.do_compile)
  do_compile: True

  # torch._dynamo cache size limit. (--train.dynamo_cache_size_limit)
  dynamo_cache_size_limit: 256

# Evaluation-related arguments. See ``litgpt.args.EvalArgs`` for details
eval:
  # Number of optimizer steps between evaluation calls (type: int, default: 1000)
  interval: 2000

  # Number of tokens to generate (type: Optional[int], default: null)
  max_new_tokens:

  # Number of iterations (type: int, default: 100)
  max_iters: 1

  # Whether to evaluate on the validation set at the beginning of the training
  initial_validation: true

  # Whether to evaluate on the validation set at the end the training
  final_validation: true

# Optimizer-related arguments
optimizer:
  class_path: torch.optim.AdamW

  init_args:
    #   (type: float, default: 0.001)
    # handled by "peak_lr" above
    lr:

    #   (type: float, default: 0.01)
    weight_decay: 0.1

    #   (type: tuple, default: (0.9,0.999))
    betas:
      - 0.9
      - 0.95

  # class_path: torch.optim.SGD
  # init_args:
  #   #   (type: float, default: 0.001)
  #   lr: 6e-4

# How many devices/GPUs to use. Uses all GPUs by default. (type: Union[int, str], default: auto)
devices: auto

# How many nodes to use. (type: int, default: 1)
num_nodes: 1

# Optional path to the tokenizer dir that was used for preprocessing the dataset. Only some data
# module require this. (type: Optional[Path], default: null)
tokenizer_dir: /data/snoplus/weiiiiiii/aiproj/driftmtplm/checkpoints/extended/meta-llama/Llama-3.2-1B-Instruct-MTPV128384

# The name of the logger to send metrics to. (type: Literal['wandb', 'tensorboard', 'csv'], default: tensorboard)
logger_name: wandb

# The random seed to use for reproducibility. (type: int, default: 42)
seed: 42

# Singleshot MTP masking/rollout arguments. (--singleshot.*)
singleshot:
  mtp_special_token_pattern: "<|mtp_special_token_{i}|>"
  hard_teacher_supervision: true
  hard_self_teacher_supervision: false
  extra_train_metrics: false
  truncation_length: 160
  k_toks_min: "0-2"
  k_toks_max: "0-16"
  rand_rank_k_toks: True
  mask_region_ct: 5
  rollout_multiplier: 4

  # ------------------------------------------------------------------
  # DriftMTP. Everything ABOVE this line is byte-identical to
  # reproduce_full_1gpu.yaml, so this file is that config plus drift.
  #
  # TO REPRODUCE VANILLA MTP: set BOTH of the next two to false.
  #   * drift_enabled: false  -> pretrain.py takes `total_loss = loss`, with
  #     the drift loss never computed and no gradient contribution at all.
  #   * drift_diagnostics_enabled: false -> the Phase 2 diagnostics hook is
  #     gated on its OWN flag, independent of drift_enabled, so leaving it on
  #     would still add forward work and logging to a "vanilla" run.
  # With both false this file is the vanilla config in every respect except
  # out_dir, resume and the wandb run name.
  # ------------------------------------------------------------------
  drift_enabled: true
  drift_diagnostics_enabled: false
  drift_diagnostics_mmd_warmup_steps: 2000

  # lambda_drift, FIXED for the whole run -- there is no adaptive mode.
  # Calibrated for ~10% of the native MTP loss in the PLATEAU region, which is
  # where a full run spends nearly all its time, NOT at initialization:
  #   L_MTP(plateau) = 0.6    (run ipwhlbyo "Rep_l3_magpie_metamath", 1.6M
  #                            global steps: mean `loss` 0.54 over the last
  #                            half, 0.64 over the 20-50% band)
  #   L_drift        = 5.648  (measured mean over 200 steps of condor run
  #                            5758025, this exact drift config; std 0.28)
  #   lambda         = 0.1 * 0.6 / 5.648 = 1.06e-2
  # Expect drift/aux_native_loss_ratio ~1.3% at the start and ~10% once L_MTP
  # reaches its plateau. See docs/phase5_sanity_experiment_report.md s17.7.
  drift_weight: 1.06e-2

  # Mask the query's OWN paired teacher token out of the positives, mirroring
  # the self-exclusion always applied to the negatives. Without it, y_pos[r] is
  # the teacher state for the same token as x[r], so as the student converges
  # that pair sits at distance 0 and takes all the positive mass while its own
  # negative is masked -- a systematic residual that makes "student == teacher"
  # NOT a fixed point. Report s17.
  drift_exclude_self_positive: true

  # Paper's temperature ladder. Summed (not averaged) after per-temperature RMS
  # field normalization, so a rung damped by eps drops out instead of dividing
  # the survivors by n_tau.
  drift_temperatures: [0.02, 0.05, 0.2]
  drift_step_size: 1.0
  drift_use_column_norm: false

# Pretokenized/preprocessed dataset (pqds) arguments. (--pqds.*)
pqds:
  dataset_script_config_file: config_hub/data/p2p_generic_metamath.yaml
  dataset_sources_config_file: config_hub/data/metamath_strat_split_chat_train.yaml
  train_dataset_folder_path: /data/snoplus/weiiiiiii/aiproj/driftmtplm/dataset/train/outputs/Llama-3.2-1B-Instruct-MTPV128384/processed/train
  val_dataset_folder_path: /data/snoplus/weiiiiiii/aiproj/driftmtplm/dataset/train/outputs/Llama-3.2-1B-Instruct-MTPV128384/processed/val
# Weights & Biases logging arguments. (--wandb.*)
wandb:
  run_name: drift_l3_1b_Instruct_metamath_lam1.06e-2_nocolnorm
  project: drift-mtp
  entity: po-wei-huang-university-of-oxford
